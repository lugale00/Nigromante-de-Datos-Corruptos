<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="Nigromante de datos corruptos" content="width=device-width, initial-scale=1.0">
        <title>Nigromante de datos corruptos</title>
        <link rel="stylesheet" href="resources/styles/web.css">
        <link rel="stylesheet" href="resources/styles/game.css">
        <script src="resources/scripts/wsinvocation_sesion.js" defer></script>
        <script src="resources/scripts/wsinvocation_game.js" defer></script>
        <script src="resources/scripts/juego.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Tiny5&display=swap" rel="stylesheet">
        <link rel="icon" type="image/png" href="resources/images/favicon.png">
    </head>
    <body>
        <header>
            <h1>Cementerio maldito</h1>
        </header>
        <main>
            <div id="juego">
                <div id="jugador">
                    <p id="jugador-vida">Vida: 100</p>
                    <img src="resources/images/nigromante.png" alt="Personaje del jugador" id="jugador-img">
                </div>
                <div id="mision">
                    <!-- Se carga dinámicamente -->
                </div>
                <div id="enemigos">
                    <div class="enemigo">  
                        <div id="enemigo-vida">
                            <img src="resources/images/corazon.png" alt="corazón del enemigo" class="vida-enemigo">
                            <img src="resources/images/corazon.png" alt="corazón del enemigo" class="vida-enemigo">
                            <img src="resources/images/corazon.png" alt="corazón del enemigo" class="vida-enemigo">
                        </div>
                        <img src="" alt="Personaje del enemigo" class="enemigo-img">
                    </div>
                </div>
            </div>
            <div id="historia"></div>
            <div id="sentencias">
                <div id="tablas">
                    <p>Tablas disponibles:</p>
                    <ul id="tablas-lista">
                        <!-- Se carga dinámicamente -->
                    </ul>
                </div>
                <div id="escribir">
                    <textarea id="sentencia" placeholder="Escribe tu sentencia SQL aquí..."></textarea>
                    <div id="botones-escribir">
                        <button id="enviar"> Invocar </button>
                        <button id="consultar"> Consultar </button>
                    </div>
                </div>
            </div>
            <div id="feedback-container"></div>
            <div id="resultado-container"></div>
            <!-- Panel de tutorial -->
            <div id="tutorial-overlay">
                <div id="tutorial-panel">
                    <div id="tutorial-fantasmas">
                        <div class="fantasma-tutorial" id="fantasma-Mortis">
                            <img src="resources/images/enemies/enemigo_fantasma.png" alt="Mortis">
                            <p class="fantasma-nombre">Mortis</p>
                        </div>
                        <div class="fantasma-tutorial" id="fantasma-Lira">
                            <img src="resources/images/enemies/enemigo_fantasma_lvl2.png" alt="Lira">
                            <p class="fantasma-nombre">Lira</p>
                        </div>
                        <div class="fantasma-tutorial" id="fantasma-Grimm">
                            <img src="resources/images/enemies/enemigo_caballo.png" alt="Grimm">
                            <p class="fantasma-nombre">Grimm</p>
                        </div>
                        <div class="fantasma-tutorial" id="fantasma-Pip">
                            <img src="resources/images/enemies/enemigo_araña.png" alt="Pip">
                            <p class="fantasma-nombre">Pip</p>
                        </div>
                    </div>
                    <div id="tutorial-dialogo">
                        <p id="tutorial-fantasma-nombre"></p>
                        <p id="tutorial-mensaje"></p>
                    </div>
                    <div id="tutorial-botones">
                        <button id="tutorial-siguiente">Siguiente →</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Modal de tabla -->
        <div id="modal-overlay">
            <div id="modal">
                <button id="modal-cerrar">✕</button>
                <h2 id="modal-titulo"></h2>
                <ul id="modal-atributos"></ul>
            </div>
        </div>
    </body>
</html>
