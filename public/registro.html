<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nigromante de datos corruptos</title>
        <link rel="stylesheet" href="resources/styles/index.css">
        <link rel="stylesheet" href="resources/styles/web.css">
        <link rel="icon" type="image/png" href="resources/images/favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Tiny5&display=swap" rel="stylesheet">
        <script src="resources/scripts/wsinvocation_sesion.js"></script>
        <script src="resources/scripts/registro.js" defer></script>
        <script src="resources/scripts/audio.js"></script>
    </head>
    <body>
        <header>
            <h1>Nigromante de <br>datos corruptos</h1>
            <button id="btn-audio" onclick="toggleAudio()">
                <img id="icono-audio" src="resources/images/nota.png" alt="Música activa">
            </button>
        </header>
        <main>
            <div id="formulario">
                <p>Nombre de usuario:</p>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre de usuario">
                <p>Correo electrónico:</p>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
                <p>Contraseña:</p>
                <input type="password" id="contraseña" name="contraseña" placeholder="Contraseña">
                <p>Confirmar contraseña:</p>
                <input type="password" id="confirmar-contraseña" name="confirmar-contraseña" placeholder="Repite la contraseña">
                <div id="opciones-inicio">
                    <button id="registrarse">Registrarse</button>
                    <button id="volver" onclick="window.location.href='inicio_sesion.html'">Volver</button>
                </div>
                <p id="error-registro"></p>
            </div>
        </main>
        <script>
            document.addEventListener('DOMContentLoaded', () => iniciarAudio('menu'));
        </script>
    </body>
</html>
