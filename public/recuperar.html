<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nigromante de datos corruptos</title>
        <link rel="stylesheet" href="resources/styles/index.css">
        <link rel="stylesheet" href="resources/styles/web.css">
        <link rel="icon" type="image/png" href="resources/images/favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Tiny5&display=swap" rel="stylesheet">
        <script src="resources/scripts/recuperar.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Nigromante de <br>datos corruptos</h1>
        </header>
        <main>
            <div id="formulario">

                <!-- Paso 1: Introducir email -->
                <div id="paso-email">
                    <p>Correo electrónico:</p>
                    <input type="email" id="email" placeholder="correo@ejemplo.com">
                    <div id="opciones-inicio">
                        <button id="btn-enviar-codigo">Enviar código</button>
                        <button onclick="window.location.href='inicio_sesion.html'">Volver</button>
                    </div>
                    <p id="error-email"></p>
                </div>

                <!-- Paso 2: Introducir código y nueva contraseña -->
                <div id="paso-codigo" style="display:none">
                    <p>Código de verificación:</p>
                    <input type="text" id="codigo" placeholder="000000" maxlength="6">
                    <p>Nueva contraseña:</p>
                    <input type="password" id="nueva-contrasena" placeholder="Nueva contraseña">
                    <p>Confirmar contraseña:</p>
                    <input type="password" id="confirmar-contrasena" placeholder="Repite la contraseña">
                    <div id="opciones-inicio">
                        <button id="btn-verificar">Cambiar contraseña</button>
                        <button id="btn-reenviar">Reenviar código</button>
                    </div>
                    <p id="error-codigo"></p>
                </div>

            </div>
        </main>
    </body>
</html>
